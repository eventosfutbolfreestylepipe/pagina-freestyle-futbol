<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipe Fútbol - Eventos Masivos</title>
    <!-- Fuentes estilo Tech / Sport -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Teko:wght@600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #1e242c;
            --text-main: #ffffff;
            --text-muted: #a0aec0;
            --accent-hud: #4a5568;
            --glow-hud: rgba(138, 180, 248, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Fondo limpio con profundidad estilo premium (sin cuadrícula) */
            background: radial-gradient(circle at 30% 50%, #29313a 0%, #1e242c 80%);
            background-color: var(--bg-dark); /* Color de respaldo */
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* --- Menú Minimalista / Estilo Game --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 60px;
            position: relative;
            z-index: 10;
        }

        .logo {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-line {
            width: 150px;
            height: 1px;
            background-color: var(--text-muted);
            margin-right: 20px;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 1.1rem;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--text-main);
            text-shadow: 0 0 8px var(--text-main);
        }

        nav span {
            color: var(--text-muted);
        }

        /* --- Hero Section --- */
        main {
            display: flex;
            padding: 40px 60px;
            min-height: 80vh;
            position: relative;
        }

        .content-left {
            width: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 10;
        }

        h1 {
            font-family: 'Teko', sans-serif;
            font-size: 7rem;
            line-height: 0.9;
            text-transform: uppercase;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .subtitle {
            font-size: 2.2rem;
            font-weight: 600;
            margin-bottom: 50px;
            max-width: 80%;
            line-height: 1.2;
        }

        /* --- Botón CTA con Hover Efecto HUD --- */
        .btn-cta {
            display: inline-flex;
            align-items: center;
            background: linear-gradient(90deg, #424e5a 0%, #2a343d 100%);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            padding: 15px 40px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 2px solid #6b7a8f;
            cursor: pointer;
            width: fit-content;
            /* Corte geométrico en las esquinas */
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
            transition: all 0.3s ease;
            position: relative;
        }

        .btn-cta:hover {
            background: linear-gradient(90deg, #5c6c7d 0%, #3a4752 100%);
            border-color: #a0aec0;
            box-shadow: 0 0 15px var(--glow-hud);
            transform: translateY(-2px);
        }

        .btn-cta span {
            margin-left: 15px;
            font-size: 1.5rem;
        }

        /* --- Mini Logo Authenticity Badge --- */
        .badge {
            position: absolute;
            bottom: 40px;
            left: 60px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 10;
        }

        .badge img {
            width: 60px;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            border: 1px solid var(--text-muted);
            padding: 5px;
        }

        .badge p {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.2;
        }

        /* --- Contenedor de Imagen y HUD (Lado Derecho) --- */
        .image-right {
            position: absolute;
            right: 0;
            top: 0;
            width: 60%;
            height: 100%;
            z-index: 5;
        }

        /* Efecto Profundidad HUD (Marco Base) */
        .hud-background {
            position: absolute;
            right: 40px;
            bottom: 20px;
            width: 80%;
            height: 70%;
            /* Borde sutil */
            border: 2px solid rgba(255,255,255,0.05);
            /* Corte diagonal en la esquina superior izquierda */
            clip-path: polygon(25% 0, 100% 0, 100% 100%, 0 100%, 0 45%);
            background-color: rgba(255, 255, 255, 0.02);
            z-index: 3;
        }

        /* Decoraciones HUD (Líneas finas) */
        .hud-background::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            border: 1px solid rgba(255,255,255,0.1);
            clip-path: polygon(25% 0, 100% 0, 100% 100%, 0 100%, 0 45%);
            pointer-events: none;
        }

        /* --- Slideshow Estilo Menú FIFA --- */
        .fifa-slideshow {
            position: absolute;
            bottom: 5%; 
            right: 5%;  
            width: 500px;
            height: 350px;
            z-index: 4; /* Sobre el fondo HUD, detrás del jugador */
            
            /* Difuminado de los bordes hacia el fondo */
            -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 70%);
            mask-image: radial-gradient(circle, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 70%);
            
            pointer-events: none; 
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; 
            opacity: 0;
            filter: grayscale(20%) contrast(110%);
            
            /* Animación: 6 segundos en total (2s por foto x 3 fotos) */
            animation: fifaCrossfade 6s infinite;
        }

        /* Tiempos de aparición */
        .slide-1 { animation-delay: 0s; }
        .slide-2 { animation-delay: 2s; }
        .slide-3 { animation-delay: 4s; }

        /* La animación de fundido */
        @keyframes fifaCrossfade {
            0%   { opacity: 0; }
            10%  { opacity: 0.6; }
            33%  { opacity: 0.6; }
            43%  { opacity: 0; }
            100% { opacity: 0; }
        }

        /* Jugador de Fútbol principal */
        .player-img {
            position: absolute;
            bottom: 10%;
            right: 25%;
            height: 80%;
            z-index: 6;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.8));
        }

        /* --- APNG Spinning Ball --- */
        .spinning-ball {
            position: absolute;
            top: 25%;
            right: 20%;
            width: 80px;
            z-index: 7;
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Responsive básico */
        @media (max-width: 1024px) {
            h1 { font-size: 5rem; }
            .subtitle { font-size: 1.8rem; }
            .content-left { width: 60%; }
            .fifa-slideshow { width: 350px; height: 250px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Pipe Fútbol</div>
        <nav>
            <div class="nav-line"></div>
            <a href="#">Inicio</a> <span>|</span>
            <a href="#">Shows</a> <span>|</span>
            <a href="#">Contacto</a>
        </nav>
    </header>

    <main>
        <div class="content-left">
            <h1>MUCHO MÁS<br>QUE FÚTBOL</h1>
            <p class="subtitle">Eventos masivos y shows de alto impacto en Colombia.</p>
            
            <button class="btn-cta">
                Cotizar Mi Evento <span>&#10142;</span>
            </button>
        </div>

        <div class="image-right">
            <!-- Capa de profundidad HUD -->
            <div class="hud-background"></div>

            <!-- Slideshow estilo FIFA en la esquina -->
            <div class="fifa-slideshow">
                <!-- Reemplaza el src con las rutas de tus fotos reales -->
                <img src="evento1.jpg" class="slide slide-1">
<img src="evento2.jpg" class="slide slide-2">
<img src="evento3.jpg" class="slide slide-3">
            </div>
            
            <!-- Jugador principal (Asegúrate de que tenga fondo transparente PNG) -->
<img src="mi-foto.png" alt="Pipe" class="player-img">            
            <!-- Balón giratorio -->
            <img src="https://via.placeholder.com/100x100/ffffff/000000?text=Balon" alt="Balón girando" class="spinning-ball">
        </div>
    </main>

    <div class="badge">
        <img src="https://via.placeholder.com/60x60/333/fff?text=LOGO" alt="Pipe Logo">
        <p>Mini Logo<br>Authenticity Badge</p>
    </div>

</body>
</html>
