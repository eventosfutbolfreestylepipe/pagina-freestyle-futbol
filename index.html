<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipe Shows - Futbol Freestyle Colombia</title>
    <!-- Fuentes estilo Tech / Sport -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Teko:wght@500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #101419; /* Fondo más oscuro */
            --text-main: #ffffff;
            --text-muted: #a0aec0;
            --accent-hud: #4a5568;
            --glow-hud: rgba(138, 180, 248, 0.4);
            --neon-blue: #00f0ff; /* Color azul brillante clarito */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Fondo radial más oscuro */
            background: radial-gradient(circle at 30% 50%, #1a222b 0%, var(--bg-dark) 80%);
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Líneas geométricas de fondo (Textura) */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: -50px;
            width: 300px;
            height: 100%;
            background-image: 
                linear-gradient(0deg, transparent 24%, rgba(255, 255, 255, 0.02) 25%, rgba(255, 255, 255, 0.02) 26%, transparent 27%, transparent 74%, rgba(255, 255, 255, 0.02) 75%, rgba(255, 255, 255, 0.02) 76%, transparent 77%, transparent),
                linear-gradient(90deg, transparent 24%, rgba(255, 255, 255, 0.02) 25%, rgba(255, 255, 255, 0.02) 26%, transparent 27%, transparent 74%, rgba(255, 255, 255, 0.02) 75%, rgba(255, 255, 255, 0.02) 76%, transparent 77%, transparent);
            background-size: 50px 50px;
            z-index: 0;
            pointer-events: none;
        }

        /* --- Menú Minimalista / Estilo Game --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 60px;
            position: relative;
            z-index: 20;
        }

        /* Mejoras en el Logo */
        .logo {
            display: flex;
            flex-direction: column;
            line-height: 0.9;
        }
        
        .logo-sub {
            font-size: 1rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .logo-main {
            font-family: 'Teko', sans-serif;
            font-size: 2.8rem;
            font-weight: 600;
            color: var(--neon-blue);
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-line {
            width: 150px;
            height: 1px;
            background-color: var(--text-muted);
            margin-right: 20px;
        }

        /* Enlaces con Neón inferior */
        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 1.1rem;
            transition: all 0.3s;
            position: relative;
            padding-bottom: 5px;
        }

        nav a::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: 0;
            width: 0;
            height: 2px;
            background-color: var(--neon-blue);
            box-shadow: 0 0 8px var(--neon-blue);
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }

        nav a:hover {
            color: var(--text-main);
            text-shadow: 0 0 8px var(--text-main);
        }

        nav a:hover::after {
            width: 100%;
        }

        nav span {
            color: var(--text-muted);
            opacity: 0.3;
        }

        /* --- Hero Section --- */
        main {
            display: flex;
            padding: 40px 60px;
            flex-grow: 1;
            position: relative;
            z-index: 10;
        }

        .content-left {
            width: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 20; /* Elevado para asegurar clics */
        }

        h1 {
            font-family: 'Teko', sans-serif;
            font-size: 7rem;
            line-height: 0.9;
            text-transform: uppercase;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .subtitle {
            font-size: 2.2rem;
            font-weight: 600;
            margin-bottom: 25px;
            max-width: 80%;
            line-height: 1.2;
        }

        /* --- Cuadros de Servicios (Nuevos) --- */
        .services-container {
            width: 100%;
            max-width: 550px;
            margin-bottom: 20px;
        }

        .services-title {
            font-size: 1.2rem;
            color: var(--neon-blue);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 5px rgba(0, 240, 255, 0.3);
        }

        .services-grid {
            display: flex;
            gap: 12px;
        }

        .service-card {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 8px;
            text-decoration: none;
            color: var(--text-main);
            text-align: center;
            border-radius: 4px;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .service-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 2px; height: 100%;
            background: var(--neon-blue);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .service-card:hover {
            background: rgba(0, 240, 255, 0.05);
            border-color: rgba(0, 240, 255, 0.4);
            box-shadow: 0 5px 15px rgba(0, 240, 255, 0.15);
            transform: translateY(-3px);
        }

        .service-card:hover::before {
            opacity: 1;
        }

        .card-icon {
            font-family: 'Teko', sans-serif;
            font-size: 1.8rem;
            color: var(--text-muted);
            line-height: 1;
            margin-bottom: 5px;
            transition: color 0.3s;
        }

        .service-card:hover .card-icon {
            color: var(--neon-blue);
        }

        .card-text {
            font-size: 0.95rem;
            font-weight: 700;
            line-height: 1.2;
        }

        /* --- Contenedor de Imagen y HUD (Lado Derecho) --- */
        .image-right {
            position: absolute;
            right: 0;
            top: 0;
            width: 60%;
            height: 100%;
            z-index: 5;
        }

        .hud-background {
            position: absolute;
            right: 40px;
            bottom: 20px;
            width: 80%;
            height: 70%;
            border: 2px solid rgba(255,255,255,0.03);
            clip-path: polygon(25% 0, 100% 0, 100% 100%, 0 100%, 0 45%);
            background-color: rgba(255, 255, 255, 0.01);
            z-index: 3;
        }

        .hud-background::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            border: 1px solid rgba(0,240,255,0.2); /* Detalle neón en HUD */
            clip-path: polygon(25% 0, 100% 0, 100% 100%, 0 100%, 0 45%);
            pointer-events: none;
        }

        /* --- Slideshow Estilo Menú FIFA (Escritorio) --- */
        .fifa-slideshow {
            position: absolute;
            bottom: 5%; 
            right: 5%;  
            width: 500px;
            height: 350px;
            z-index: 4; 
            -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 70%);
            mask-image: radial-gradient(circle, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 70%);
            pointer-events: none; 
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; 
            opacity: 0;
            filter: grayscale(20%) contrast(110%);
            animation: fifaCrossfade 6s infinite;
        }

        .slide-1 { animation-delay: 0s; }
        .slide-2 { animation-delay: 2s; }
        .slide-3 { animation-delay: 4s; }

        @keyframes fifaCrossfade {
            0%   { opacity: 0; }
            10%  { opacity: 0.6; }
            33%  { opacity: 0.6; }
            43%  { opacity: 0; }
            100% { opacity: 0; }
        }

        /* Jugador de Fútbol principal */
        .player-img {
            position: absolute;
            bottom: 15%; 
            left: -5%;   
            height: 70%; 
            z-index: 15; 
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.9));
        }

        /* APNG Spinning Ball */
        .spinning-ball {
            position: absolute;
            top: 35%;  
            left: 15%; 
            width: 70px; 
            z-index: 16; 
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* --- Mini Logo Authenticity Badge --- */
        .badge {
            position: absolute;
            bottom: 40px;
            left: 60px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 10;
        }

        .badge img {
            width: 60px;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            border: 1px solid rgba(0, 240, 255, 0.4);
            padding: 5px;
        }

        .badge p {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.2;
        }

        /* =========================================
           ADAPTACIÓN PARA CELULARES Y TABLETS
           ========================================= */
        @media (max-width: 1024px) {
            h1 { font-size: 5rem; }
            .subtitle { font-size: 1.8rem; }
            .content-left { width: 60%; }
            .fifa-slideshow { width: 350px; height: 250px; }
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                padding: 15px;
                gap: 10px;
            }
            
            .logo { 
                align-items: center;
                text-align: center;
            }
            .logo-sub { font-size: 0.8rem; }
            .logo-main { font-size: 2rem; }

            .nav-line { display: none; }
            nav { gap: 15px; font-size: 0.95rem; }

            main { 
                flex-direction: column; 
                padding: 20px; 
            }
            
            .content-left {
                width: 100%;
                align-items: flex-start; 
                text-align: left;
                margin-bottom: 5px;
            }

            h1, .subtitle {
                max-width: 55%; /* Espacio para el jugador a la derecha */
            }

            h1 { font-size: 3rem; margin-bottom: 12px; }
            .subtitle { font-size: 1rem; margin-bottom: 15px; line-height: 1.3;}
            
            /* Ajuste de los 4 cuadros horizontales en móvil */
            .services-container {
                max-width: 100%; /* Toma todo el ancho disponible ahora */
                margin-top: 10px;
                z-index: 30; /* Clave para que se pueda clickear por encima del jugador */
                position: relative;
            }
            
            .services-title {
                font-size: 0.9rem;
            }

            .services-grid {
                gap: 6px; /* Espacio reducido entre cuadros */
            }

            .service-card {
                padding: 8px 4px;
                flex: 1; /* Esto hace que los 4 quepan equitativamente a lo ancho (Como dibujado en edited-image.png) */
                min-height: 85px;
                justify-content: center;
            }

            .card-icon {
                font-size: 1.4rem;
                margin-bottom: 3px;
            }

            .card-text {
                font-size: 0.65rem; /* Letra pequeña para que entren todos en la fila horizontal */
            }

            .image-right {
                position: static; 
                width: 100%;
                margin-top: 20px;
                display: flex;
                flex-direction: column;
            }

            .hud-background { display: none; }

            .player-img {
                position: absolute;
                top: 0px;   
                right: -30px;
                left: auto;
                bottom: auto;
                height: 450px; 
                width: auto;
                z-index: 15; /* El z-index de los cuadros (30) es mayor para que sean clickeables */
            }

            .spinning-ball {
                position: absolute;
                top: 80px;  
                right: 90px; 
                left: auto;
                width: 45px;
            }

            .fifa-slideshow {
                position: relative; 
                width: 100%; 
                height: 220px;
                right: 0; bottom: 0; top: 0; left: 0;
                margin-top: 15px;
                -webkit-mask-image: radial-gradient(ellipse at center, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 90%);
                mask-image: radial-gradient(ellipse at center, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 90%);
            }

            .badge {
                position: relative;
                bottom: auto; left: auto;
                justify-content: center;
                padding-bottom: 30px;
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <span class="logo-sub">Futbol Freestyle Colombia</span>
            <span class="logo-main">Pipe Shows</span>
        </div>
        <nav>
            <div class="nav-line"></div>
            <a href="#">Inicio</a> <span>|</span>
            <a href="#">Shows</a> <span>|</span>
            <a href="#">Contacto</a>
        </nav>
    </header>

    <main>
        <div class="content-left">
            <h1>MUCHO MÁS<br>QUE FÚTBOL</h1>
            
            <p class="subtitle">Experiencias inolvidables que conectan y sorprenden.</p>
            
            <!-- Aquí reemplazamos por los 4 mini cuadros horizontales -->
            <div class="services-container">
                <h3 class="services-title">Lleva tu show de fútbol a:</h3>
                <div class="services-grid">
                    
                    <a href="#empresas" class="service-card">
                        <span class="card-icon">01</span>
                        <span class="card-text">Empresas</span>
                    </a>
                    
                    <a href="#activaciones" class="service-card">
                        <span class="card-icon">02</span>
                        <span class="card-text">Activaciones de marca</span>
                    </a>
                    
                    <a href="#cumpleanos" class="service-card">
                        <span class="card-icon">03</span>
                        <span class="card-text">Cumpleaños y eventos</span>
                    </a>
                    
                    <a href="#colegios" class="service-card">
                        <span class="card-icon">04</span>
                        <span class="card-text">Colegios e institutos</span>
                    </a>

                </div>
            </div>
            
        </div>

        <div class="image-right">
            <div class="hud-background"></div>

            <div class="fifa-slideshow">
                <img src="evento1.jpg" class="slide slide-1">
                <img src="evento2.jpg" class="slide slide-2">
                <img src="evento3.jpg" class="slide slide-3">
            </div>
            
            <img src="mi-foto.png" alt="Pipe" class="player-img">            
            
            <img src="https://via.placeholder.com/100x100/ffffff/000000?text=Balon" alt="Balón girando" class="spinning-ball">
        </div>
    </main>

    <div class="badge">
        <img src="https://via.placeholder.com/60x60/333/fff?text=LOGO" alt="Pipe Logo">
        <p>Mini Logo<br>Authenticity Badge</p>
    </div>

</body>
</html>
