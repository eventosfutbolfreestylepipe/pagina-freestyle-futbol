<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipe Shows - Futbol Freestyle Colombia</title>
    <!-- Fuentes estilo Tech / Sport -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Teko:wght@500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #101419;
            --text-main: #ffffff;
            --text-muted: #a0aec0;
            --accent-hud: #4a5568;
            --glow-hud: rgba(138, 180, 248, 0.4);
            --neon-blue: #00f0ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 30% 50%, #1a222b 0%, var(--bg-dark) 80%);
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- Menú Minimalista / Estilo Game --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 60px;
            position: relative;
            z-index: 20;
        }

        .logo {
            display: flex;
            flex-direction: column;
            line-height: 0.9;
        }
        
        .logo-sub {
            font-size: 1rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .logo-main {
            font-family: 'Teko', sans-serif;
            font-size: 2.8rem;
            font-weight: 600;
            color: var(--neon-blue);
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .nav-line {
            width: 100px;
            height: 1px;
            background-color: var(--text-muted);
            margin-right: 15px;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 1.15rem; /* FUENTE MÁS GRANDE EN ESCRITORIO */
            transition: all 0.3s;
            position: relative;
            padding-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap; 
        }

        /* Efecto línea inferior para enlaces normales */
        nav a:not(.btn-cotizar)::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: 0;
            width: 0;
            height: 2px;
            background-color: var(--neon-blue);
            box-shadow: 0 0 8px var(--neon-blue);
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }

        nav a:not(.btn-cotizar):hover {
            color: var(--text-main);
            text-shadow: 0 0 8px var(--text-main);
        }

        nav a:not(.btn-cotizar):hover::after {
            width: 100%;
        }

        /* Puntico separador */
        nav span {
            color: var(--text-muted);
            opacity: 0.5;
            font-size: 1.3rem;
            display: inline-block;
            transform: translateY(-2px); 
        }

        /* --- Botón "Cotizar" Estilo Imagen --- */
        .btn-cotizar {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 16px;
            margin-left: 5px;
            font-weight: 700;
            font-size: 1.15rem; /* FUENTE MÁS GRANDE */
            position: relative;
        }

        .btn-cotizar::before {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 70%; height: 75%;
            border-top: 2px solid var(--text-muted);
            border-right: 2px solid var(--text-muted);
            transition: all 0.3s ease;
        }

        .btn-cotizar::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0;
            width: 70%; height: 75%;
            border-bottom: 2px solid var(--text-muted);
            border-left: 2px solid var(--text-muted);
            transition: all 0.3s ease;
        }

        .btn-cotizar:hover {
            color: var(--neon-blue);
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
        }

        .btn-cotizar:hover::before, 
        .btn-cotizar:hover::after {
            border-color: var(--neon-blue);
            width: 100%; 
            height: 100%;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2) inset;
        }


        /* --- Hero Section --- */
        main {
            display: flex;
            padding: 40px 60px;
            flex-grow: 1;
            position: relative;
            z-index: 10;
        }

        .content-left {
            width: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 20;
        }

        h1 {
            font-family: 'Teko', sans-serif;
            font-size: 5.5rem; 
            line-height: 0.9;
            text-transform: uppercase;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .subtitle {
            font-size: 1.6rem;
            font-weight: 500;
            margin-bottom: 25px;
            max-width: 90%;
            line-height: 1.2;
        }

        /* Azul Neón aplicado solo al texto y alineado correctamente */
        .text-neon {
            color: var(--neon-blue);
            font-weight: 700;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
            font-size: 1.8rem;
        }

        /* --- Cuadros de Servicios --- */
        .services-container {
            width: 100%;
            max-width: 600px; 
        }

        .services-grid {
            display: flex;
            gap: 12px;
        }

        .service-card {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 10px;
            text-decoration: none;
            color: var(--text-main);
            text-align: center;
            border-radius: 4px;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            min-height: 90px;
        }

        .service-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 2px; height: 100%;
            background: var(--neon-blue);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .service-card:hover {
            background: rgba(0, 240, 255, 0.05);
            border-color: rgba(0, 240, 255, 0.4);
            box-shadow: 0 5px 15px rgba(0, 240, 255, 0.15);
            transform: translateY(-3px);
        }

        .service-card:hover::before {
            opacity: 1;
        }

        .card-text {
            font-size: 1.2rem; /* FUENTE DE LOS CUADROS MÁS GRANDE */
            font-weight: 700;
            line-height: 1.2;
        }


        /* --- Contenedor de Imagen y HUD (Lado Derecho) --- */
        .image-right {
            position: absolute;
            right: 0;
            top: 0;
            width: 60%;
            height: 100%;
            z-index: 5;
        }

        .hud-background {
            position: absolute;
            right: 40px;
            bottom: 20px;
            width: 80%;
            height: 70%;
            border: 2px solid rgba(255,255,255,0.03);
            clip-path: polygon(25% 0, 100% 0, 100% 100%, 0 100%, 0 45%);
            background-color: rgba(255, 255, 255, 0.01);
            z-index: 3;
        }

        .hud-background::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            border: 1px solid rgba(0,240,255,0.2);
            clip-path: polygon(25% 0, 100% 0, 100% 100%, 0 100%, 0 45%);
            pointer-events: none;
        }

        /* --- Slideshow Estilo Menú FIFA --- */
        .fifa-slideshow {
            position: absolute;
            bottom: 5%; 
            right: 5%;  
            width: 500px;
            height: 350px;
            z-index: 4; 
            -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 70%);
            mask-image: radial-gradient(circle, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 70%);
            pointer-events: none; 
        }

        .slide {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; 
            opacity: 0;
            filter: grayscale(20%) contrast(110%);
            animation: fifaCrossfade 6s infinite;
        }

        .slide-1 { animation-delay: 0s; }
        .slide-2 { animation-delay: 2s; }
        .slide-3 { animation-delay: 4s; }

        @keyframes fifaCrossfade {
            0%   { opacity: 0; }
            10%  { opacity: 0.6; }
            33%  { opacity: 0.6; }
            43%  { opacity: 0; }
            100% { opacity: 0; }
        }

        /* Jugador de Fútbol principal */
        .player-img {
            position: absolute;
            bottom: 15%; 
            left: -5%;   
            height: 70%; 
            z-index: 15; 
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.9));
        }

        /* APNG Spinning Ball */
        .spinning-ball {
            position: absolute;
            top: 35%;  
            left: 15%; 
            width: 70px; 
            z-index: 16; 
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* --- Mini Logo --- */
        .badge {
            position: absolute;
            bottom: 40px;
            left: 60px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 10;
        }

        .badge img {
            width: 60px;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            border: 1px solid rgba(0, 240, 255, 0.4);
            padding: 5px;
        }

        .badge p {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.2;
        }

        /* =========================================
           ADAPTACIÓN PARA CELULARES Y TABLETS
           ========================================= */
        @media (max-width: 1024px) {
            h1 { font-size: 4rem; }
            .subtitle { font-size: 1.4rem; }
            .text-neon { font-size: 1.5rem; }
            .content-left { width: 60%; }
            .fifa-slideshow { width: 350px; height: 250px; }
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                padding: 15px;
                gap: 15px;
            }
            
            .logo { 
                align-items: center;
                text-align: center;
            }
            .logo-sub { font-size: 0.8rem; }
            .logo-main { font-size: 2rem; }

            .nav-line { display: none; }
            
            nav { 
                flex-wrap: nowrap; 
                justify-content: center;
                gap: 5px; /* Ajustado para que el texto grande quepa en 1 línea */
                width: 100%;
            }

            nav a { 
                font-size: 0.85rem; /* FUENTE DEL MENÚ AUMENTADA EN MÓVIL */
            }

            nav span { 
                display: inline-block; 
                font-size: 0.9rem; 
                margin: 0;
            }

            .btn-cotizar { 
                margin-left: 0; 
                padding: 5px 8px; 
                font-size: 0.85rem; 
            }

            main { 
                flex-direction: column; 
                padding: 20px; 
            }
            
            .content-left {
                width: 100%;
                align-items: flex-start; 
                text-align: left;
                margin-bottom: 5px;
            }

            h1, .subtitle { max-width: 55%; }
            h1 { font-size: 2.5rem; margin-bottom: 10px; }
            .subtitle { font-size: 1rem; margin-bottom: 15px; line-height: 1.3;}
            .text-neon { font-size: 1.1rem; margin-top: 2px; }
            
            /* Ajuste de los 4 cuadros horizontales en móvil */
            .services-container {
                max-width: 100%; 
                margin-top: 10px;
                z-index: 30; 
                position: relative;
            }
            
            .services-grid { gap: 6px; }

            .service-card {
                padding: 12px 4px;
                flex: 1; 
                min-height: 100px;
            }

            .card-text {
                font-size: 0.85rem; /* FUENTE DE CUADROS AUMENTADA EN MÓVIL */
            }

            .image-right {
                position: static; 
                width: 100%;
                margin-top: 20px;
                display: flex;
                flex-direction: column;
            }

            .hud-background { display: none; }

            .player-img {
                position: absolute;
                top: -80px;   
                right: 7px;
                left: auto;
                bottom: auto;
                height: 350px; 
                width: auto;
                z-index: 15;
            }

            .spinning-ball {
                position: absolute;
                top: 100px;  
                right: 90px; 
                left: auto;
                width: 45px;
            }

            .fifa-slideshow {
                position: relative; 
                width: 100%; 
                height: 220px;
                right: 0; bottom: 0; top: 0; left: 0;
                margin-top: 5px;
                -webkit-mask-image: radial-gradient(ellipse at center, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 90%);
                mask-image: radial-gradient(ellipse at center, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 90%);
            }

            .badge {
                position: relative;
                bottom: auto; left: auto;
                justify-content: center;
                padding-bottom: 30px;
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <span class="logo-sub">Futbol Freestyle Colombia</span>
            <span class="logo-main">Pipe Shows</span>
        </div>
        <nav>
            <div class="nav-line"></div>
            <a href="#">Inicio</a> <span>&bull;</span>
            <a href="#">Elige tu Show</a> <span>&bull;</span>
            <a href="#">Experiencia</a> <span>&bull;</span>
            <a href="#cotizar" class="btn-cotizar">Cotizar</a>
        </nav>
    </header>

    <main>
        <div class="content-left">
            <h1>MUCHO MÁS<br>QUE FÚTBOL</h1>
            
            <p class="subtitle">
                Conecta y sorprende con <br>
                <span class="text-neon">Show de futbol freestyle</span> para:
            </p>
            
            <div class="services-container">
                <div class="services-grid">
                    
                    <a href="#empresas" class="service-card">
                        <span class="card-text">Empresas</span>
                    </a>
                    
                    <a href="#activaciones" class="service-card">
                        <span class="card-text">Activa<br>tu marca</span>
                    </a>
                    
                    <a href="#cumpleanos" class="service-card">
                        <span class="card-text">Cumpleaños y<br>celebraciones</span>
                    </a>
                    
                    <a href="#colegios" class="service-card">
                        <span class="card-text">Colegios<br>y eventos</span>
                    </a>

                </div>
            </div>
            
        </div>

        <div class="image-right">
            <div class="hud-background"></div>

            <div class="fifa-slideshow">
                <img src="evento1.jpg" class="slide slide-1">
                <img src="evento2.jpg" class="slide slide-2">
                <img src="evento3.jpg" class="slide slide-3">
            </div>
            
            <img src="mi-foto.png" alt="Pipe" class="player-img">            
            
            <img src="https://via.placeholder.com/100x100/ffffff/000000?text=Balon" alt="Balón girando" class="spinning-ball">
        </div>
    </main>

    <div class="badge">
        <img src="https://via.placeholder.com/60x60/333/fff?text=LOGO" alt="Pipe Logo">
        <p>Mini Logo<br>Authenticity Badge</p>
    </div>

</body>
</html>
