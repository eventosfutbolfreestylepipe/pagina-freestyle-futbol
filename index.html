<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipe Shows - Futbol Freestyle Colombia</title>
    <!-- Fuentes estilo Tech / Sport -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Teko:wght@600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #1e242c;
            --text-main: #ffffff;
            --text-muted: #a0aec0;
            --accent-hud: #4a5568;
            --glow-hud: rgba(138, 180, 248, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 30% 50%, #29313a 0%, #1e242c 80%);
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- Menú Minimalista / Estilo Game --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 60px;
            position: relative;
            z-index: 20;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 1.1;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-line {
            width: 150px;
            height: 1px;
            background-color: var(--text-muted);
            margin-right: 20px;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 1.1rem;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--text-main);
            text-shadow: 0 0 8px var(--text-main);
        }

        nav span {
            color: var(--text-muted);
        }

        /* --- Hero Section --- */
        main {
            display: flex;
            padding: 40px 60px;
            flex-grow: 1;
            position: relative;
        }

        .content-left {
            width: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 10;
        }

        h1 {
            font-family: 'Teko', sans-serif;
            font-size: 7rem;
            line-height: 0.9;
            text-transform: uppercase;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .subtitle {
            font-size: 2.2rem;
            font-weight: 600;
            margin-bottom: 15px;
            max-width: 80%;
            line-height: 1.2;
        }

        /* Caja para "Apto para todo público" */
        .slogan-box {
            display: inline-block;
            border: 1px solid var(--text-muted);
            padding: 8px 15px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.05);
            margin-bottom: 40px;
            width: fit-content;
            color: #d1d5db;
        }

        /* --- Botón CTA --- */
        .btn-cta {
            display: inline-flex;
            align-items: center;
            background: linear-gradient(90deg, #424e5a 0%, #2a343d 100%);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            padding: 15px 40px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 2px solid #6b7a8f;
            cursor: pointer;
            width: fit-content;
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
            transition: all 0.3s ease;
            position: relative;
        }

        .btn-cta:hover {
            background: linear-gradient(90deg, #5c6c7d 0%, #3a4752 100%);
            border-color: #a0aec0;
            box-shadow: 0 0 15px var(--glow-hud);
            transform: translateY(-2px);
        }

        .btn-cta span {
            margin-left: 15px;
            font-size: 1.5rem;
        }

        /* --- Mini Logo Authenticity Badge --- */
        .badge {
            position: absolute;
            bottom: 40px;
            left: 60px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 10;
        }

        .badge img {
            width: 60px;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            border: 1px solid var(--text-muted);
            padding: 5px;
        }

        .badge p {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.2;
        }

        /* --- Contenedor de Imagen y HUD (Lado Derecho) --- */
        .image-right {
            position: absolute;
            right: 0;
            top: 0;
            width: 60%;
            height: 100%;
            z-index: 5;
        }

        .hud-background {
            position: absolute;
            right: 40px;
            bottom: 20px;
            width: 80%;
            height: 70%;
            border: 2px solid rgba(255,255,255,0.05);
            clip-path: polygon(25% 0, 100% 0, 100% 100%, 0 100%, 0 45%);
            background-color: rgba(255, 255, 255, 0.02);
            z-index: 3;
        }

        .hud-background::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            border: 1px solid rgba(255,255,255,0.1);
            clip-path: polygon(25% 0, 100% 0, 100% 100%, 0 100%, 0 45%);
            pointer-events: none;
        }

        /* --- Slideshow Estilo Menú FIFA (Escritorio) --- */
        .fifa-slideshow {
            position: absolute;
            bottom: 5%; 
            right: 5%;  
            width: 500px;
            height: 350px;
            z-index: 4; 
            -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 70%);
            mask-image: radial-gradient(circle, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 70%);
            pointer-events: none; 
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; 
            opacity: 0;
            filter: grayscale(20%) contrast(110%);
            animation: fifaCrossfade 6s infinite;
        }

        .slide-1 { animation-delay: 0s; }
        .slide-2 { animation-delay: 2s; }
        .slide-3 { animation-delay: 4s; }

        @keyframes fifaCrossfade {
            0%   { opacity: 0; }
            10%  { opacity: 0.6; }
            33%  { opacity: 0.6; }
            43%  { opacity: 0; }
            100% { opacity: 0; }
        }

        /* Jugador de Fútbol principal */
        .player-img {
            position: absolute;
            bottom: 15%; 
            left: -5%;   
            height: 70%; 
            z-index: 15; 
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.8));
        }

        /* APNG Spinning Ball */
        .spinning-ball {
            position: absolute;
            top: 35%;  
            left: 15%; 
            width: 70px; 
            z-index: 16; 
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* =========================================
           ADAPTACIÓN PARA CELULARES Y TABLETS
           ========================================= */
        @media (max-width: 1024px) {
            h1 { font-size: 5rem; }
            .subtitle { font-size: 1.8rem; }
            .content-left { width: 60%; }
            .fifa-slideshow { width: 350px; height: 250px; }
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                padding: 15px;
                gap: 10px;
            }
            
            .logo { 
                font-size: 1.3rem; 
                text-align: center;
                line-height: 1.2;
            }
            .nav-line { display: none; }
            nav { gap: 15px; font-size: 0.95rem; }

            main { 
                flex-direction: column; 
                padding: 20px; 
                position: relative; /* Clave para posicionar al jugador absoluto a toda la vista principal */
            }
            
            /* Contenedor Izquierdo alineado a la izquierda */
            .content-left {
                width: 100%;
                align-items: flex-start; /* Textos a la izquierda */
                text-align: left;
                margin-bottom: 5px;
            }

            /* Restringimos el ancho de los textos para que no choquen con la foto del jugador a la derecha */
            h1, .subtitle, .slogan-box {
                max-width: 55%; 
            }

            h1 { font-size: 2.8rem; line-height: 0.9; margin-bottom: 12px; }
            
            .subtitle { font-size: 1rem; margin-bottom: 10px; line-height: 1.3;}
            
            .slogan-box {
                font-size: 0.8rem;
                padding: 5px 8px;
                margin-bottom: 25px;
            }

            /* BOTÓN CENTRADO Y PEQUEÑO */
            .btn-cta {
                align-self: center; /* Override para que solo el botón se centre en la pantalla */
                font-size: 0.85rem;
                padding: 10px 20px;
                margin-top: 10px;
            }
            .btn-cta span { font-size: 1rem; margin-left: 8px;}

            /* Contenedor Derecho (Desacoplado para no estorbar) */
            .image-right {
                position: static; /* Permite que el jugador y el balón escapen al contenedor main */
                width: 100%;
                margin-top: 20px;
                display: flex;
                flex-direction: column;
            }

            .hud-background { display: none; }

            /* JUGADOR: Arriba a la derecha, enorme, al lado del texto */
            .player-img {
                position: absolute;
                top: -75px;   /* Pegado al inicio del área principal */
                right: 2px;
                left: auto;
                bottom: auto;
                height: 450px; /* Tamaño muy ampliado */
                width: auto;
                transform: none; 
            }

            /* BALÓN: Acompañando al jugador */
            .spinning-ball {
                position: absolute;
                top: 50px;  /* Ajusta si queda desfasado */
                right: 90px; /* Ajusta si queda desfasado */
                left: auto;
                width: 45px;
            }

            /* SLIDESHOW (Fotos difuminadas solas en la parte inferior) */
            .fifa-slideshow {
                position: relative; 
                width: 100%; 
                height: 220px;
                right: 0;
                bottom: 0; 
                top: 0;
                left: 0;
                margin-top: 15px;
                -webkit-mask-image: radial-gradient(ellipse at center, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 90%);
                mask-image: radial-gradient(ellipse at center, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 90%);
            }

            .badge {
                position: relative;
                bottom: auto; left: auto;
                justify-content: center;
                padding-bottom: 30px;
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Futbol Freestyle Colombia<br>Pipe Shows</div>
        <nav>
            <div class="nav-line"></div>
            <a href="#">Inicio</a> <span>|</span>
            <a href="#">Shows</a> <span>|</span>
            <a href="#">Contacto</a>
        </nav>
    </header>

    <main>
        <div class="content-left">
            <h1>MUCHO MÁS<br>QUE FÚTBOL</h1>
            
            <p class="subtitle">Experiencias inolvidables que conectan y sorprenden.</p>
            
            <div class="slogan-box">Apto para todo publico y edades.</div>
            
            <button class="btn-cta">
                Cotizar Mi Evento <span>&#10142;</span>
            </button>
        </div>

        <div class="image-right">
            <div class="hud-background"></div>

            <div class="fifa-slideshow">
                <img src="evento1.jpg" class="slide slide-1">
                <img src="evento2.jpg" class="slide slide-2">
                <img src="evento3.jpg" class="slide slide-3">
            </div>
            
            <img src="mi-foto.png" alt="Pipe" class="player-img">            
            
            <img src="https://via.placeholder.com/100x100/ffffff/000000?text=Balon" alt="Balón girando" class="spinning-ball">
        </div>
    </main>

    <div class="badge">
        <img src="https://via.placeholder.com/60x60/333/fff?text=LOGO" alt="Pipe Logo">
        <p>Mini Logo<br>Authenticity Badge</p>
    </div>

</body>
</html>
